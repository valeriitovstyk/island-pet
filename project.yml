name: IslandPet
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ''
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0'
targets:
  Shared:
    type: framework
    platform: iOS
    sources: [Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).islandpet.shared
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  IslandPet:
    type: application
    platform: iOS
    sources: [IslandPet]
    dependencies:
      - target: Shared
        embed: true
      - target: IslandPetWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).islandpet
        INFOPLIST_KEY_CFBundleDisplayName: Острівний персонаж
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: IslandPet/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: islandpet
            CFBundleURLSchemes: [islandpet]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: IslandPet/IslandPet.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).islandpet
  IslandPetWidget:
    type: app-extension
    platform: iOS
    sources: [IslandPetWidget]
    dependencies:
      - target: Shared
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).islandpet.widget
        SKIP_INSTALL: YES
    info:
      path: IslandPetWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: IslandPetWidget/IslandPetWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).islandpet
